<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <main>
      <section class="game-container">
        <h1>TIC TAC TOE</h1>
        <div class="game-board">
          <button type="button" class="game-block" data-position="1"></button>
          <button type="button" class="game-block" data-position="2"></button>
          <button type="button" class="game-block" data-position="3"></button>
          <button type="button" class="game-block" data-position="4"></button>
          <button type="button" class="game-block" data-position="5"></button>
          <button type="button" class="game-block" data-position="6"></button>
          <button type="button" class="game-block" data-position="7"></button>
          <button type="button" class="game-block" data-position="8"></button>
          <button type="button" class="game-block" data-position="9"></button>
        </div>
      </section>
    </main>
  </body>
</html>
